name: Release Please
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # release-type is required by the action; the rest of the config
          # (packages, extra-files, current version) is in
          # release-please-config.json + .release-please-manifest.json.
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
