name: Release Please
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Configuration is managed in release-please-config.json and the
          # current released version in .release-please-manifest.json.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
